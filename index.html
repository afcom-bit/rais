<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Radio Islam Sragen</title>

<link rel="manifest" href="manifest.json">

<style>

/* ==============================
   DASAR
============================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    position: fixed;
    inset: 0;

    display: flex;
    justify-content: center;
    align-items: flex-start;

    padding-top: 20px;

    overflow: auto;

    background:
        linear-gradient(
            145deg,
            #061a16 0%,
            #0b3028 50%,
            #04110e 100%
        );

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* ==============================
   FRAME HP
============================== */

.android-phone {
    position: relative;

    width: 360px;
    height: fit-content;

    padding: 5px;

    background:
        linear-gradient(
            135deg,
            #6F2DBD 0%,
            #7B68EE 45%,
            #87CEEB 100%
        );

    border: 1px solid #6A5ACD;

    border-radius: 42px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.55),
        inset 0 0 0 1px rgba(255,255,255,0.5),
        0 0 25px rgba(135,206,235,0.4);

    overflow: hidden;

    box-sizing: border-box;
}


/* ==============================
   KAMERA / SENSOR HP
============================== */

.android-phone::before {
    content: "";

    position: absolute;

    top: 10px;
    left: 50%;

    transform: translateX(-50%);

    width: 70px;
    height: 18px;

    background: #050505;

    border-radius: 20px;

    z-index: 20;

    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.08);
}

.android-phone::after {
    content: "";

    position: absolute;

    top: 16px;
    left: calc(50% + 22px);

    width: 6px;
    height: 6px;

    background: #18233a;

    border-radius: 50%;

    z-index: 21;

    box-shadow:
        0 0 4px rgba(100,160,255,0.8);
}


/* ==============================
   LAYAR HP
============================== */

.phone-screen {
    position: relative;

    width: 100%;
    height: fit-content;

    min-height: 0;

    padding-top: 32px;
    padding-bottom: 20px;

    background:
        linear-gradient(
            180deg,
            #061b17 0%,
            #092a23 50%,
            #03100d 100%
        );

    border-radius: 36px;

    overflow: hidden;

    box-sizing: border-box;
}


/* ==============================
   FRAME / PLAYER UTAMA
============================== */

.player-card {
    position: relative;

    width: 100%;

    margin: 0 auto 0 auto;

    padding: 25px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.10),
            rgba(255,255,255,0.035)
        );

    border: 1px solid rgba(255,255,255,0.16);

    border-top: none;

    border-radius: 36px;

    box-shadow:
        inset 0 0 25px rgba(255,255,255,0.025),
        0 10px 30px rgba(0,0,0,0.25);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    text-align: center;

    overflow: hidden;

    box-sizing: border-box;
}


/* ==============================
   AREA LOGO
============================== */

.logo-area {
    position: relative;

    width: 100%;
    height: 250px;

    margin-bottom: 20px;

    overflow: hidden;

    border-radius: 15px;
}


/* ==============================
   BACKGROUND LOGO
============================== */

.logo-placeholder {
    position: absolute;

    left: -5px;
    top: 5px;

    width: calc(100% + 10px);
    height: 250px;

    background:
        linear-gradient(
            135deg,
            #e7b94d 0%,
            #fff0a8 50%,
            #c99528 100%
        );

    border-radius: 15px;

    overflow: hidden;

    z-index: 1;
}

.logo-placeholder img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}


/* ==============================
   NAMA STASIUN
============================== */

.station-sub {
    position: absolute;

    left: 0;
    right: 0;

    bottom: 10px;

    z-index: 3;

    color: #ffffff;

    font-size: 15px;
    font-weight: bold;

    letter-spacing: 2px;

    text-shadow:
        0 2px 5px rgba(0,0,0,0.75);
}


/* ==============================
   TEKS INFORMASI
============================== */

.info-text-container {
    position: relative;

    width: 100%;

    max-height: 352px;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 0 15px;

    color: #ffffff;

    font-size: 16px;

    line-height: 1.3;

    text-align: justify;

    user-select: text;
    -webkit-user-select: text;

    touch-action: pan-y;

    scrollbar-width: thin;
}


/* Scrollbar */

.info-text-container::-webkit-scrollbar {
    width: 5px;
}

.info-text-container::-webkit-scrollbar-track {
    background: rgba(255,255,255,0.05);

    border-radius: 10px;
}

.info-text-container::-webkit-scrollbar-thumb {
    background: #d7ae42;

    border-radius: 10px;
}


/* ==============================
   PARAGRAF INFORMASI
============================== */

.info-text-container p {
    margin-top: 0;
    margin-bottom: 4px;

    min-height: 20.8px;
}


/* ==============================
   DEVELOPER TAG
============================== */

.dev-tag {
    width: 100%;

    margin-top: 21px;

    color: #d7ae42;

    font-size: 13px;

    text-align: center;

    letter-spacing: 0.5px;
}


/* ==============================
   KARTU SUMBER SUARA
   JANGAN DIUBAH
============================== */

.iframe-container {
    position: absolute;
    left: 0;
    bottom: 5px;

    width: 100%;
    height: 83px;

    border-radius: 12px;

    overflow: hidden !important;

    background: transparent !important;

    border: 1px solid rgba(255,255,254,0.4);

    z-index: 4;

    --crop-left: -50px;
    --crop-top: -135px;
}


/* ==============================
   IFRAME
============================== */

iframe {
    position: absolute;

    width: 480px;
    height: 445px;

    border: none;

    overflow: hidden !important;

    touch-action: none;

    left: var(--crop-left);
    top: var(--crop-top);

    z-index: 5;
}


/* ==============================
   RESPONSIVE
============================== */

@media (max-width: 380px) {

    body {
        padding-top: 10px;
    }

    .android-phone {
        width: calc(100vw - 10px);
        max-width: 360px;
    }

    .player-card {
        padding: 22px;
    }
}


/* ==============================
   PENCEGAHAN ZOOM
============================== */

html {
    touch-action: manipulation;
}

</style>
</head>


<body>


<div class="android-phone">

    <div class="phone-screen">

        <div class="player-card">


            <!-- =========================
                 LOGO
            ========================== -->

            <div class="logo-area">

                <div class="logo-placeholder">

                    <img
                        src="logo.png"
                        alt="Radio Islam Sragen">

                </div>

            </div>


            <!-- =========================
                 INFORMASI RADIO
            ========================== -->

            <div
                class="info-text-container"
                id="infoText">


                <p>══════📻🆁🅰🅸🆂</p>

                <p>&nbsp;</p>

                <p>📚 Qasidah</p>

                <p>&nbsp;&nbsp;&nbsp;Unwanulhikam</p>

                <p>🎙 Al-Ustadz&nbsp; Usamah&nbsp; bin</p>

                <p>&nbsp;&nbsp;&nbsp;Faishol Mahri&nbsp; حفظه ا لله</p>

                <p>&nbsp;</p>

                <p>📚 Tausiyah</p>

                <p>🎙 Al-Ustadz Huda حفظه ا لله</p>

                <p>&nbsp;</p>

                <p>📌 Masjid Alfalah, Sragen</p>

                <p>&nbsp;&nbsp;&nbsp;Ahad Tgl 20 Juli 2025</p>

                <p>&nbsp;</p>

                <p>&nbsp;</p>

                <p>&nbsp;</p>

                <p>&nbsp;</p>


            </div>


            <!-- =========================
                 DEVELOPER
            ========================== -->

            <div class="dev-tag">
                Radio Islam Sragen
            </div>


        </div>


        <!-- =========================
             SUMBER SUARA
             TETAP
        ========================== -->

        <div class="iframe-container">

            <iframe
                src="https://zeno.fm/player/radio-islam-sragen"
                scrolling="no"
                allow="autoplay">
            </iframe>

        </div>


    </div>

</div>


<script>

/* ==============================
   RAPikan TEXT CONTAINER
============================== */

function rapikanTextContainer() {

    const container =
        document.getElementById("infoText");

    if (!container) return;


    const paragraphs =
        container.querySelectorAll("p");


    /* Sembunyikan paragraf kosong
       yang berada di bagian paling akhir */

    for (
        let i = paragraphs.length - 1;
        i >= 0;
        i--
    ) {

        const text =
            paragraphs[i].textContent
                .replace(/\u00a0/g, "")
                .trim();

        if (text === "") {

            paragraphs[i].style.display =
                "none";

        } else {

            break;
        }
    }


    /* Maksimal tinggi */

    const maxHeight = 352;

    container.style.height =
        Math.min(
            container.scrollHeight,
            maxHeight
        ) + "px";
}


/* ==============================
   SAAT HALAMAN SELESAI DIMUAT
============================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        rapikanTextContainer();

    }
);


/* ==============================
   CEGAH ZOOM,
   TETAP IZINKAN SCROLL TEKS
============================== */

document.addEventListener(
    "touchmove",
    function (event) {

        const info =
            document.getElementById("infoText");

        if (
            info &&
            info.contains(event.target)
        ) {

            return;
        }

        if (event.touches.length > 1) {

            event.preventDefault();

        }

    },
    {
        passive: false
    }
);


/* ==============================
   SERVICE WORKER
============================== */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function () {

            navigator.serviceWorker
                .register("./sw.js")
                .catch(
                    function (error) {

                        console.log(
                            "Service Worker gagal:",
                            error
                        );

                    }
                );

        }
    );
}

</script>

</body>
</html>
