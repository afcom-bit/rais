<script>

/* =========================================================
   RAPikan TEXT CONTAINER
   ========================================================= */

function rapikanTextContainer(){

    const container =
        document.querySelector(
            '.info-text-container'
        );

    if(!container)
        return;


    const paragraphs =
        Array.from(
            container.querySelectorAll('p')
        );


    let lastFilled = -1;


    for(
        let i = 0;
        i < paragraphs.length;
        i++
    ){

        const teks =
            paragraphs[i]
                .textContent
                .trim();


        if(teks !== ''){

            lastFilled = i;

        }

    }


    paragraphs.forEach(
        (p,index)=>{

            if(index > lastFilled){

                p.style.display =
                    'none';

            }else{

                p.style.display =
                    '';

            }

        }
    );


    container.style.height =
        'auto';


    const tinggi =
        container.scrollHeight;


    if(tinggi > 352){

        container.style.height =
            '352px';

    }else{

        container.style.height =
            tinggi + 'px';

    }

}


/* =========================================================
   PLAY / PAUSE
   ========================================================= */

const playButton =
    document.getElementById(
        'playButton'
    );

const statusText =
    document.getElementById(
        'statusText'
    );


let isPlaying = true;


playButton.addEventListener(
    'click',
    function(){

        isPlaying = !isPlaying;


        if(isPlaying){

            playButton.textContent =
                '▶';

            statusText.textContent =
                'Radio Islam Sragen';

        }else{

            playButton.textContent =
                'Ⅱ';

            statusText.textContent =
                'Radio dijeda';

        }

    }
);


/* =========================================================
   STOP
   ========================================================= */

const stopButton =
    document.getElementById(
        'stopButton'
    );


stopButton.addEventListener(
    'click',
    function(){

        isPlaying = false;

        playButton.textContent =
            '▶';

        statusText.textContent =
            'Radio dihentikan';

    }
);


/* =========================================================
   VOLUME
   ========================================================= */

const volumeSlider =
    document.getElementById(
        'volumeSlider'
    );


const volumeIcon =
    document.querySelector(
        '.volume-icon'
    );


volumeSlider.addEventListener(
    'input',
    function(){

        const value =
            Number(this.value);


        if(value === 0){

            volumeIcon.textContent =
                '🔇';

        }else if(value < 50){

            volumeIcon.textContent =
                '🔉';

        }else{

            volumeIcon.textContent =
                '🔊';

        }

    }
);


/* =========================================================
   DOM READY
   ========================================================= */

document.addEventListener(
    'DOMContentLoaded',
    function(){

        rapikanTextContainer();

    }
);


/* =========================================================
   MENCEGAH ZOOM
   ========================================================= */

document.addEventListener(
    'touchmove',
    function(e){

        if(
            e.target.closest(
                '.info-text-container'
            )
        ){

            return;

        }


        if(e.scale !== 1){

            e.preventDefault();

        }

    },
    {
        passive:false
    }
);


/* =========================================================

                        )
                );

        }

    );

}

</script>
