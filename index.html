<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Radio Islam Sragen</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#202020">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

/* =========================================================
   BACKGROUND
   ========================================================= */

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}

body {
    background:
        radial-gradient(
            circle at center,
            #3a3a3a 0%,
            #181818 55%,
            #050505 100%
        );

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden !important;

    position: fixed;

    touch-action: none;

    user-select: none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   FRAME HP SAMSUNG
   ========================================================= */

.android-phone {

    position: relative;

    width: 360px;

    height: auto;

    padding: 9px 8px 0;

    background:
        linear-gradient(
            145deg,
            #55595c 0%,
            #272a2c 8%,
            #111315 25%,
            #050607 60%,
            #303336 100%
        );

    border: 1px solid #020202;

    border-radius: 32px;

    box-shadow:
        0 28px 65px rgba(0,0,0,0.85),
        0 4px 12px rgba(0,0,0,0.7),
        inset 1px 1px 0 rgba(255,255,255,0.20),
        inset -1px -1px 0 rgba(255,255,255,0.04);

    overflow: hidden;
}


/* =========================================================
   BAGIAN ATAS HP
   ========================================================= */

.samsung-top {

    height: 34px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            180deg,
            #181a1c,
            #08090a
        );
}


/* Logo Samsung */

.samsung-brand {

    position: absolute;

    left: 15px;

    top: 12px;

    font-size: 7px;

    font-weight: bold;

    letter-spacing: 1px;

    color: #7d8285;

    text-shadow:
        0 1px 1px #000;
}


/* Speaker */

.samsung-speaker {

    width: 61px;

    height: 6px;

    border-radius: 6px;

    background:
        linear-gradient(
            180deg,
            #020202 0%,
            #3b3e40 45%,
            #090a0b 100%
        );

    border: 1px solid #000;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.18),
        0 1px 2px #000;
}


/* Kamera */

.samsung-camera {

    position: absolute;

    right: 27px;

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #8195a0 0%,
            #243842 35%,
            #070c0f 70%,
            #000 100%
        );

    border: 1px solid #000;

    box-shadow:
        0 0 4px rgba(100,170,210,0.35);
}


/* Sensor */

.samsung-sensor {

    position: absolute;

    left: 27px;

    width: 6px;

    height: 6px;

    border-radius: 50%;

    background: #020304;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.15);
}


/* =========================================================
   LAYAR HP
   ========================================================= */

.phone-screen {

    position: relative;

    width: 100%;

    height: 590px;

    overflow: hidden;

    background:
        linear-gradient(
            180deg,
            #101010,
            #050505
        );
}


/* =========================================================
   ISI RADIO
   ========================================================= */

.radio-content {

    position: relative;

    width: 100%;

    height: 100%;

    overflow: hidden;

    box-sizing: border-box;

    padding-top: 10px;
}


/* Logo Radio */

.radio-logo {

    display: block;

    width: 72px;

    height: 72px;

    margin: 0 auto 5px;

    object-fit: contain;
}


/* Nama stasiun */

.station-name {

    text-align: center;

    font-size: 18px;

    font-weight: bold;

    color: #ffffff;

    margin-bottom: 6px;

    text-shadow:
        0 1px 3px #000;
}


/* =========================================================
   CONTAINER IFRAME
   ========================================================= */

.iframe-container {

    position: absolute;

    left: 4px;

    bottom: 4px;

    width: calc(100% - 8px);

    height: 83px;

    overflow: hidden;

    border-radius: 4px;

    background: #000;

    box-shadow:
        inset 0 0 5px rgba(0,0,0,0.9);
}


/* Crop iframe */

.iframe-container iframe {

    position: absolute;

    width: 480px;

    height: 445px;

    left: var(--crop-left, -50px);

    top: var(--crop-top, -135px);

    border: none;

    margin: 0;

    padding: 0;

}


/* =========================================================
   INFORMASI RADIO
   ========================================================= */

.info-text-container {

    position: relative;

    z-index: 2;

    width: 100%;

    max-height: 352px;

    overflow: hidden;

    box-sizing: border-box;

    padding: 5px 14px;

    color: #ffffff;

    text-align: center;

    font-size: 13px;

    line-height: 1.45;

    text-shadow:
        0 1px 2px #000;
}


/* Judul */

.info-title {

    font-weight: bold;

    font-size: 16px;

    margin-bottom: 5px;
}


/* Isi informasi */

.info-text {

    margin: 0;

    padding: 0;
}


/* Developer */

.developer {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 91px;

    z-index: 5;

    text-align: center;

    font-size: 9px;

    color: #777;

    pointer-events: none;
}


/* =========================================================
   NAVIGASI SAMSUNG
   ========================================================= */

.samsung-navigation {

    height: 48px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 52px;

    background:
        linear-gradient(
            180deg,
            #121416 0%,
            #060708 100%
        );

    border-top:
        1px solid rgba(255,255,255,0.08);

    box-shadow:
        inset 0 2px 4px rgba(0,0,0,0.8);
}


.nav-button {

    position: relative;

    width: 30px;

    height: 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #bfc3c5;

    opacity: 0.9;

    text-shadow:
        0 1px 2px #000;
}


/* Recent Apps */

.nav-recent::before {

    content: "";

    width: 17px;

    height: 13px;

    border: 2px solid #bfc3c5;

    border-radius: 1px;

    box-shadow:
        3px 3px 0 -1px #070809,
        3px 3px 0 1px #bfc3c5;
}


/* Home */

.nav-home {

    width: 37px;

    height: 31px;

    border-radius: 7px;

    border: 2px solid #bfc3c5;

    background:
        linear-gradient(
            180deg,
            #25282a,
            #090a0b
        );

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.15),
        0 2px 3px #000;
}


.nav-home::after {

    content: "";

    width: 11px;

    height: 11px;

    border: 1px solid #8e9599;

    border-radius: 3px;
}


/* Back */

.nav-back::before {

    content: "";

    width: 15px;

    height: 15px;

    border-left:
        2px solid #bfc3c5;

    border-bottom:
        2px solid #bfc3c5;

    transform:
        rotate(45deg);
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 390px) {

    .android-phone {

        width: calc(100vw - 24px);

        max-width: 360px;
    }

    .phone-screen {

        height: 590px;
    }
}


@media (max-height: 700px) {

    .phone-screen {

        height: 500px;
    }

    .developer {

        bottom: 82px;
    }
}


</style>
</head>


<body>


<!-- =====================================================
     FRAME SAMSUNG
     ===================================================== -->

<div class="android-phone">


    <!-- BAGIAN ATAS -->

    <div class="samsung-top">

        <div class="samsung-brand">
            SAMSUNG
        </div>

        <div class="samsung-sensor"></div>

        <div class="samsung-speaker"></div>

        <div class="samsung-camera"></div>

    </div>


    <!-- =================================================
         LAYAR HP
         ================================================= -->

    <div class="phone-screen">

        <div class="radio-content">


            <!-- LOGO RADIO -->

            <img
                src="./icon-192.png"
                class="radio-logo"
                alt="Radio Islam Sragen"
            >


            <!-- NAMA STASIUN -->

            <div class="station-name">
                RAIS
            </div>


            <!-- INFORMASI RADIO -->

            <div class="info-text-container">

                <div class="info-title">
                    ══════📻🆁🅰🅸🆂
                </div>

                <div class="info-text">

                    <p>📚 Qasidah</p>

                    <p>
                        &nbsp;&nbsp;&nbsp;Unwanulhikam
                    </p>

                    <p>
                        🎙 Al-Ustadz&nbsp;&nbsp;Usamah&nbsp;&nbsp;bin
                    </p>

                    <p>
                        &nbsp;&nbsp;&nbsp;Faishol Mahri&nbsp;&nbsp;حفظه ا لله
                    </p>

                    <p>📚 Tausiyah</p>

                    <p>
                        🎙 Al-Ustadz Huda&nbsp;&nbsp;حفظه ا لله
                    </p>

                    <p>📌 Masjid Alfalah, Sragen</p>

                    <p>
                        &nbsp;&nbsp;&nbsp;Ahad Tgl 20 Juli 2025
                    </p>

                </div>

            </div>


            <!-- DEVELOPER -->

            <div class="developer">
                dev.@fcom
            </div>


            <!-- =================================================
                 STREAM RADIO
                 ================================================= -->

            <div
                class="iframe-container"
                style="
                    --crop-left:-50px;
                    --crop-top:-135px;
                "
            >

                <iframe
                    src="https://streamy1.radioislam.my.id/player/sragen-s-station/"
                    allow="autoplay; encrypted-media"
                    scrolling="no"
                    title="Streamy Player">
                </iframe>

            </div>


        </div>

    </div>


    <!-- =================================================
         NAVIGASI SAMSUNG
         ================================================= -->

    <div class="samsung-navigation">

        <div
            class="nav-button nav-recent"
            title="Aplikasi Terbaru">
        </div>

        <div
            class="nav-button nav-home"
            title="Home">
        </div>

        <div
            class="nav-button nav-back"
            title="Kembali">
        </div>

    </div>


</div>



<script>

/* =========================================================
   MERAPIKAN INFORMASI
   ========================================================= */

function rapikanTextContainer() {

    const container =
        document.querySelector(
            ".info-text-container"
        );

    if (!container) return;


    const paragraphs =
        container.querySelectorAll("p");


    paragraphs.forEach(function(p) {

        if (
            p.textContent.trim() === ""
        ) {

            p.style.display = "none";

        }

    });


    container.style.height = "auto";

    const tinggi =
        Math.min(
            container.scrollHeight,
            352
        );

    container.style.height =
        tinggi + "px";
}


/* =========================================================
   TOUCH CONTROL
   ========================================================= */

document.addEventListener(
    "touchmove",
    function(e) {

        const target =
            e.target.closest(
                ".info-text-container"
            );

        if (!target) {

            e.preventDefault();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   SERVICE WORKER
   ========================================================= */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register("./sw.js")
                .catch(function(error) {

                    console.log(
                        "Service Worker gagal:",
                        error
                    );

                });

        }
    );
}


/* =========================================================
   LOAD
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        rapikanTextContainer();

    }
);

</script>


</body>
</html>
