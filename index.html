<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no,
      viewport-fit=cover">

<title>Radio Islam Sragen</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#202020">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

/* =========================================================
   RESET
   ========================================================= */

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
}


/* =========================================================
   BACKGROUND HALAMAN
   ========================================================= */

body {

    background:
        radial-gradient(
            circle at center,
            #3a3a3a 0%,
            #181818 55%,
            #050505 100%
        );

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden !important;

    position: fixed;

    touch-action: none;

    user-select: none;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   BODI HP SAMSUNG — TIPIS
   ========================================================= */

.android-phone {

    position: relative;

    width: 360px;

    padding: 4px 4px 0;

    background:
        linear-gradient(
            145deg,
            #55585a 0%,
            #252729 12%,
            #0b0c0d 45%,
            #1c1e20 80%,
            #4a4d4f 100%
        );

    border: 1px solid #050505;

    border-radius: 24px;

    box-shadow:
        0 18px 35px rgba(0,0,0,0.75),
        0 3px 8px rgba(0,0,0,0.65),
        inset 0 1px 1px rgba(255,255,255,0.20),
        inset 0 -1px 1px rgba(0,0,0,0.8);

    overflow: hidden;
}


/* =========================================================
   BEZEL ATAS
   ========================================================= */

.samsung-top {

    height: 27px;

    position: relative;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        linear-gradient(
            180deg,
            #151719,
            #070809
        );
}


/* Logo Samsung */

.samsung-brand {

    position: absolute;

    left: 15px;

    top: 9px;

    font-size: 7px;

    font-weight: bold;

    letter-spacing: 1px;

    color: #7d8285;

    text-shadow:
        0 1px 1px #000;
}


/* Speaker */

.samsung-speaker {

    width: 61px;

    height: 5px;

    border-radius: 6px;

    background:
        linear-gradient(
            180deg,
            #020202 0%,
            #3b3e40 45%,
            #090a0b 100%
        );

    border: 1px solid #000;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.18),
        0 1px 2px #000;
}


/* Kamera */

.samsung-camera {

    position: absolute;

    right: 27px;

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #8195a0 0%,
            #243842 35%,
            #070c0f 70%,
            #000 100%
        );

    border: 1px solid #000;

    box-shadow:
        0 0 4px rgba(100,170,210,0.35);
}


/* Sensor */

.samsung-sensor {

    position: absolute;

    left: 27px;

    width: 5px;

    height: 5px;

    border-radius: 50%;

    background: #020304;

    box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.15);
}


/* =========================================================
   LAYAR HP
   ========================================================= */

.phone-screen {

    position: relative;

    width: 100%;

    height: 590px;

    overflow: hidden;

    background: #050505;
}


/* =========================================================
   LOGO FULL SCREEN
   LAYER PALING BELAKANG
   ========================================================= */

.background-logo {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 100%;

    height: 100%;

    transform:
        translate(-50%, -50%);

    object-fit: contain;

    opacity: 0.18;

    z-index: 0;

    pointer-events: none;

    filter:
        drop-shadow(
            0 2px 5px rgba(0,0,0,0.7)
        );
}


/* =========================================================
   LAPISAN KONTEN RADIO
   ========================================================= */

.radio-overlay {

    position: relative;

    width: 100%;

    height: 100%;

    z-index: 2;
}


/* =========================================================
   INFORMASI RADIO
   ========================================================= */

.info-text-container {

    position: relative;

    z-index: 3;

    width: 100%;

    max-height: 352px;

    overflow: hidden;

    box-sizing: border-box;

    padding: 18px 14px 5px;

    color: #ffffff;

    text-align: center;

    font-size: 13px;

    line-height: 1.45;

    text-shadow:
        0 1px 3px #000;
}


/* Judul */

.info-title {

    font-weight: bold;

    font-size: 16px;

    margin-bottom: 5px;
}


/* Isi */

.info-text {

    margin: 0;

    padding: 0;
}


.info-text p {

    margin-top: 0;

    margin-bottom: 7px;
}


/* =========================================================
   DEVELOPER
   ========================================================= */

.developer {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 91px;

    z-index: 4;

    text-align: center;

    font-size: 9px;

    color: #777;

    pointer-events: none;

    text-shadow:
        0 1px 2px #000;
}


/* =========================================================
   KARTU SUMBER SUARA
   TETAP ASLI / TIDAK DIBENTUK SEPERTI HP
   ========================================================= */

.iframe-container {

    position: absolute;

    left: 4px;

    bottom: 4px;

    width: calc(100% - 8px);

    height: 83px;

    overflow: hidden;

    border-radius: 4px;

    background: #000;

    z-index: 5;
}


/* Iframe sumber suara */

.iframe-container iframe {

    position: absolute;

    width: 480px;

    height: 445px;

    left: -50px;

    top: -135px;

    border: none;

    margin: 0;

    padding: 0;
}


/* =========================================================
   NAVIGASI BAWAH SAMSUNG
   ========================================================= */

.samsung-navigation {

    height: 38px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 52px;

    background:
        linear-gradient(
            180deg,
            #111315,
            #060708
        );

    border-top:
        1px solid rgba(255,255,255,0.08);

    box-shadow:
        inset 0 1px 3px rgba(0,0,0,0.8);
}


/* Tombol navigasi */

.nav-button {

    position: relative;

    width: 30px;

    height: 30px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #bfc3c5;

    opacity: 0.9;

    text-shadow:
        0 1px 2px #000;
}


/* Recent Apps */

.nav-recent::before {

    content: "";

    width: 17px;

    height: 13px;

    border:
        2px solid #bfc3c5;

    border-radius: 1px;

    box-shadow:
        3px 3px 0 -1px #070809,
        3px 3px 0 1px #bfc3c5;
}


/* Home */

.nav-home {

    width: 37px;

    height: 29px;

    border-radius: 7px;

    border:
        2px solid #bfc3c5;

    background:
        linear-gradient(
            180deg,
            #25282a,
            #090a0b
        );

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.15),
        0 2px 3px #000;
}


.nav-home::after {

    content: "";

    width: 11px;

    height: 11px;

    border:
        1px solid #8e9599;

    border-radius: 3px;
}


/* Back */

.nav-back::before {

    content: "";

    width: 15px;

    height: 15px;

    border-left:
        2px solid #bfc3c5;

    border-bottom:
        2px solid #bfc3c5;

    transform:
        rotate(45deg);
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 390px) {

    .android-phone {

        width:
            calc(100vw - 24px);

        max-width: 360px;
    }
}


@media (max-height: 700px) {

    .phone-screen {

        height: 500px;
    }

    .developer {

        bottom: 82px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     BODI HP SAMSUNG
     ===================================================== -->

<div class="android-phone">


    <!-- BEZEL ATAS -->

    <div class="samsung-top">

        <div class="samsung-brand">
            SAMSUNG
        </div>

        <div class="samsung-sensor"></div>

        <div class="samsung-speaker"></div>

        <div class="samsung-camera"></div>

    </div>


    <!-- =================================================
         LAYAR
         ================================================= -->

    <div class="phone-screen">


        <!-- =================================================
             LOGO BESAR — PALING BELAKANG
             ================================================= -->

        <img
            src="./icon-192.png"
            class="background-logo"
            alt=""
        >


        <!-- =================================================
             SEMUA KOMPONEN RADIO DI ATAS LOGO
             ================================================= -->

        <div class="radio-overlay">


            <!-- INFORMASI RADIO -->

            <div class="info-text-container">

                <div class="info-title">
                    ══════📻🆁🅰🅸🆂
                </div>

                <div class="info-text">

                    <p>
                        📚 Qasidah
                    </p>

                    <p>
                        &nbsp;&nbsp;&nbsp;Unwanulhikam
                    </p>

                    <p>
                        🎙 Al-Ustadz&nbsp;&nbsp;Usamah&nbsp;&nbsp;bin
                    </p>

                    <p>
                        &nbsp;&nbsp;&nbsp;Faishol Mahri&nbsp;&nbsp;حفظه ا لله
                    </p>

                    <p>
                        📚 Tausiyah
                    </p>

                    <p>
                        🎙 Al-Ustadz Huda&nbsp;&nbsp;حفظه ا لله
                    </p>

                    <p>
                        📌 Masjid Alfalah, Sragen
                    </p>

                    <p>
                        &nbsp;&nbsp;&nbsp;Ahad Tgl 20 Juli 2025
                    </p>

                </div>

            </div>


            <!-- =================================================
                 DEVELOPER
                 ================================================= -->

            <div class="developer">
                dev.@fcom
            </div>


            <!-- =================================================
                 KARTU SUMBER SUARA
                 TIDAK DIUBAH
                 ================================================= -->

            <div
                class="iframe-container"
                style="
                    --crop-left:-50px;
                    --crop-top:-135px;
                "
            >

                <iframe
                    src="https://streamy1.radioislam.my.id/player/sragen-s-station/"
                    allow="autoplay; encrypted-media"

                    title="Streamy Player">
                </iframe>

            </div>


        </div>


    </div>


    <!-- =================================================
         NAVIGASI SAMSUNG
         ================================================= -->

    <div class="samsung-navigation">

        <div
            class="nav-button nav-recent"
            title="Aplikasi Terbaru">
        </div>

        <div
            class="nav-button nav-home"
            title="Home">
        </div>

        <div
            class="nav-button nav-back"
            title="Kembali">
        </div>

    </div>


</div>



<script>

/* =========================================================
   MERAPIKAN TEXT
   ========================================================= */

function rapikanTextContainer() {

    const container =
        document.querySelector(
            ".info-text-container"
        );

    if (!container) return;


    const paragraphs =
        container.querySelectorAll("p");


    paragraphs.forEach(function(p) {

        if (
            p.textContent.trim() === ""
        ) {

            p.style.display = "none";

        }

    });


    container.style.height = "auto";


    const tinggi =
        Math.min(
            container.scrollHeight,
            352
        );


    container.style.height =
        tinggi + "px";
}


/* =========================================================
   MENCEGAH ZOOM / GESER
   ========================================================= */

document.addEventListener(
    "touchmove",
    function(e) {

        const target =
            e.target.closest(
                ".info-text-container"
            );

        if (!target) {

            e.preventDefault();

        }

    },
    {
        passive: false
    }
);


/* =========================================================
   SERVICE WORKER
   ========================================================= */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register("./sw.js")
                .catch(function(error) {

                    console.log(
                        "Service Worker gagal:",
                        error
                    );

                });

        }
    );
}


/* =========================================================
   SAAT HALAMAN SELESAI
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        rapikanTextContainer();

    }
);

</script>


</body>
</html>
