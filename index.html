<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1b4d3e">
<link rel="manifest" href="manifest.json">
<title>Radio Islam Sragen</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Tahoma,sans-serif}body{display:flex;align-items:center;justify-content:center;padding:12px;color:#fff;background:linear-gradient(135deg,#0e0e0e,#1b4d3e)}
.phone{width:min(360px,100%);overflow:hidden;border:3px solid #d8cbaa;border-radius:42px;background:linear-gradient(145deg,#cfefe0,#e8f5e9 50%,#fff3d6);box-shadow:0 20px 50px #0009,inset 0 0 20px #fff6}
.top{position:relative;height:42px;display:flex;align-items:center;justify-content:center}.speaker{width:62px;height:8px;border-radius:8px;background:linear-gradient(#303030,#090909)}.camera{position:absolute;top:17px;left:calc(50% + 45px);width:7px;height:7px;border-radius:50%;background:#111}.dev{position:absolute;top:13px;left:44px;margin:0;color:#6f644b;font-size:10px;font-weight:600}
.screen{width:calc(100% - 10px);margin:auto;overflow:hidden;border-radius:20px;background:linear-gradient(135deg,#0e0e0e,#1b4d3e);box-shadow:inset 0 0 12px #0009}.card{border:1px solid #fff9;border-radius:20px;overflow:hidden;background:#ffffff25;backdrop-filter:blur(20px)}.logo{position:relative;height:300px}.logo img{width:100%;height:100%;display:block;object-fit:cover}.stream{position:absolute;bottom:5px;left:0;width:100%;height:83px;overflow:hidden;border:1px solid #fff8;border-radius:12px}.stream iframe{position:absolute;top:-135px;left:-50px;width:480px;height:445px;border:0}
.bottom{height:58px;display:flex;align-items:center;justify-content:center;gap:42px}.nav,.home{display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s}.nav:active,.home:active{transform:scale(.92)}.nav{width:28px;height:28px;border:1px solid #788c8d;border-radius:50%;background:linear-gradient(145deg,#e8f5e9,#cfefe0);color:#315546}.share:before{content:"☰";font-size:15px}.theme:before{content:"☾";font-size:20px}.home{width:62px;height:32px;border:1px solid #827355;border-radius:10px;background:linear-gradient(145deg,#fff3d6,#d8cbaa)}.home i{width:13px;height:13px;border:2px solid #8c8062;border-radius:3px}
.overlay{position:fixed;inset:0;z-index:9;display:none;background:#0009}.popup{position:fixed;z-index:10;top:50%;left:50%;display:none;width:min(300px,calc(100vw - 32px));padding:20px;color:#244438;text-align:center;background:linear-gradient(145deg,#cfefe0,#fff3d6);border:2px solid #d8cbaa;border-radius:22px;box-shadow:0 15px 45px #000a;transform:translate(-50%,-50%)}.active{display:block}.title{margin-bottom:15px;font-size:18px;font-weight:700}.content{padding:10px;white-space:pre-line;text-align:left;background:#fffc;border:1px solid #9ead9d;border-radius:10px}.btn{width:100%;height:42px;margin-top:8px;border:0;border-radius:12px;cursor:pointer;color:#244438;font-weight:600;background:linear-gradient(145deg,#e8f5e9,#fff3d6)}
.phone.dark{color:#f6efff;border-color:#76509a;background:linear-gradient(145deg,#09070f,#251237 55%,#4a2469);box-shadow:0 20px 50px #000b,inset 0 0 20px #a85de438}.phone.dark .screen{background:linear-gradient(135deg,#07050d,#21102f 55%,#3b1a58)}.phone.dark .card{border-color:#e4c9ff7a;background:#25103a59}.phone.dark .dev{color:#e9d6ff}.phone.dark .nav,.phone.dark .home,.phone.dark~.popup .btn{color:#f4eaff;border-color:#dcb8ff7a;background:linear-gradient(145deg,#5a2e7e,#21102f)}.phone.dark .home i{border-color:#ead8ff}.phone.dark .nav{color:#f0e2ff}.phone.dark .theme:before{content:"☼"}.phone.dark~.popup{color:#f4eaff;border-color:#76509a;background:linear-gradient(145deg,#2e1744,#100817)}.phone.dark~.popup .content{color:#f4eaff;border-color:#dcb8ff5c;background:#09070fad}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="top"><span class="dev">dev.@fcom</span><span class="speaker"></span><span class="camera"></span></div>
  <div class="screen"><div class="card"><div class="logo">
    <img src="./icon-192.png" alt="Radio Islam Sragen">
    <div class="stream"><iframe src="https://streamy1.radioislam.my.id/player/sragen-s-station/" allow="autoplay;encrypted-media" scrolling="no"></iframe></div>
  </div></div></div>
  <div class="bottom"><button class="nav share" id="share" aria-label="Bagikan"></button><button class="home" id="home" aria-label="Infoemasi"><i></i></button><button class="nav theme" id="theme" aria-label="Tema"></button></div>
</div>

<div class="overlay" id="overlay"></div>

<div class="popup" id="shareMenu">
  <div class="title">Bagikan Radio Islam Sragen</div>
  <button class="btn" id="systemShare">📤 Bagikan Link</button>
  <button class="btn" id="copyLink">🔗 Salin Link</button>
  <button class="btn close">✕ Tutup</button>
</div>

<div class="popup" id="infoMenu">
  <div class="title">Infoemasi</div>
  <div class="content" id="infoContent"></div>
  <button class="btn close">✕ Tutup</button>
</div>

<script>
const info=[
  "Radio Islam Sragen (RAIS)",
  "Dengarkan siaran Radio Islam Sragen secara langsung.",
  "Gunakan tombol bagikan untuk mengirimkan link radio kepada keluarga dan sahabat."
];
const $=s=>document.querySelector(s),phone=$("#phone"),overlay=$("#overlay"),shareMenu=$("#shareMenu"),infoMenu=$("#infoMenu");
function closeAll(){overlay.classList.remove("active");shareMenu.classList.remove("active");infoMenu.classList.remove("active")}
$("#share").onclick=()=>{overlay.classList.add("active");shareMenu.classList.add("active")};
$("#home").onclick=()=>{$("#infoContent").textContent=info.join("\n\n");overlay.classList.add("active");infoMenu.classList.add("active")};
overlay.onclick=closeAll;document.querySelectorAll(".close").forEach(x=>x.onclick=closeAll);
$("#theme").onclick=()=>{let dark=!phone.classList.contains("dark");phone.classList.toggle("dark",dark);localStorage.setItem("rais-phone-theme",dark?"dark":"light")};
$("#systemShare").onclick=async()=>{let d={title:"Radio Islam Sragen",text:"Dengarkan Radio Islam Sragen",url:location.href};try{navigator.share?await navigator.share(d):(await navigator.clipboard.writeText(d.url),alert("Link berhasil disalin."))}catch(e){}};
$("#copyLink").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);alert("Link berhasil disalin.")}catch(e){prompt("Salin link berikut:",location.href)}};
phone.classList.toggle("dark",localStorage.getItem("rais-phone-theme")==="dark");
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
