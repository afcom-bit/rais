name: APK Studio RAIS

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Siapkan kunci tanda tangan
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/rais.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/rais.jks" >> "$GITHUB_ENV"
          else
            echo "Tidak ada kunci; memakai kunci debug."
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Kumpulkan APK
        run: cp android/app/build/outputs/apk/release/app-release.apk StudioRAIS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: StudioRAIS
          path: StudioRAIS.apk

      - name: Terbitkan rilis
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete studio-terbaru -y --cleanup-tag || true
          gh release create studio-terbaru StudioRAIS.apk \
            --title "Studio RAIS – APK terbaru (versi 1.0.${{ github.run_number }})" \
            --notes "Unduh StudioRAIS.apk lalu pasang di HP Android (izinkan pemasangan dari sumber ini bila diminta)." \
            --latest=false
